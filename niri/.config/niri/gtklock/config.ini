[main]
# Tema apenas deste processo. Não altera GTK_THEME nem preferências do GNOME.
gtk-theme=Adwaita-dark
time-format=%H:%M
date-format=%A, %d de %B
# Ocultar apenas a apresentação: o ext-session-lock continua ativo.
# GTKLock 4 preserva uma senha parcial ao esconder o formulário.
start-hidden=true
idle-hide=true
idle-timeout=15
